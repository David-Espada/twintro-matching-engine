[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "twintro-engine"
version = "1.0.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.115.12", "uvicorn[standard]>=0.34,<1", "pydantic-settings>=2.7,<3",
  "sqlalchemy==2.0.41", "psycopg[binary]>=3.2,<4", "pgvector>=0.3,<1",
  "numpy>=2.1,<3", "scikit-learn>=1.6,<2", "sentence-transformers==4.1.0",
  "transformers==4.51.3", "regex==2024.11.6", "torch==2.7.1",
  "httpx>=0.28,<1"
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<10", "ruff>=0.11,<1"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["integration: requires local model or PostgreSQL"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
